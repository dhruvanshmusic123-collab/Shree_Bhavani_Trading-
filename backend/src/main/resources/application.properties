# ── Application ──
spring.application.name=shree-bhavani-trading
server.port=8080
server.servlet.context-path=/api

# ── Database ──
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bhavani_trading?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000

# ── JPA ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ──
app.jwt.secret=${JWT_SECRET:BhavaniTradingSecretKey2024VeryLongSecretKeyForJWT256Bit}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── File upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ── CORS ──
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://shreebhavanitrading.com}

# ── Logging ──
logging.level.com.bhavani=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%level] %logger{36} - %msg%n
