version: "3.9"

services:
  # ── MySQL Database ──────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: bhavani_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bhavani_trading
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BhavaniDB@2024}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-BhavaniDB@2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bhavani_net

  # ── Spring Boot Backend ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bhavani_backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/bhavani_trading?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BhavaniDB@2024}
      JWT_SECRET: ${JWT_SECRET:-BhavaniTradingSecretKey2024VeryLongSecretKeyForJWT256Bit}
      JWT_EXPIRATION: 86400000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://shreebhavanitrading.com}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - bhavani_net

  # ── Next.js Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-919824017613}
    container_name: bhavani_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-919824017613}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - bhavani_net

  # ── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bhavani_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads:/app/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - bhavani_net

volumes:
  mysql_data:
  uploads:

networks:
  bhavani_net:
    driver: bridge
